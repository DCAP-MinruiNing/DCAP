<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCAP - 目标详情</title>
    <!-- 引入 Chart.js 用于绘制光变曲线 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 1.5rem;
            margin: 0;
            color: #38bdf8;
        }
        .back-link {
            color: #94a3b8;
            text-decoration: none;
        }
        .back-link:hover {
            color: #f8fafc;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
        .card {
            background-color: #1e293b;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        .card h2 {
            font-size: 1.2rem;
            margin-top: 0;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
            color: #38bdf8;
        }
        .stamp-row {
            display: flex;
            justify-content: space-around;
            gap: 10px;
            text-align: center;
            margin-top: 15px;
        }
        .stamp-box img {
            max-width: 100%;
            height: auto;
            border: 1px solid #475569;
            border-radius: 4px;
            background: #000;
        }
        .stamp-box p {
            font-size: 0.85rem;
            color: #94a3b8;
            margin: 5px 0 0 0;
        }
        .controls {
            margin-bottom: 15px;
        }
        select {
            background: #334155;
            color: #fff;
            border: 1px solid #475569;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.9rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.9rem;
        }
        th, td {
            border: 1px solid #334155;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #0f172a;
            color: #38bdf8;
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>DCAP 目标详情</h1>
        <a href="index.html" class="back-link">&larr; 返回目标列表</a>
    </header>

    <div id="target-info" class="card">
        <h2 id="target-title">加载中...</h2>
        <div id="metadata-content"></div>
    </div>

    <div class="grid">
        <div class="card">
            <h2>观测切片 (Stamps)</h2>
            <div class="controls" id="epoch-control-container" style="display:none;">
                <label for="epoch-select">选择观测日期：</label>
                <select id="epoch-select" onchange="switchEpoch(this.value)"></select>
            </div>
            <div class="stamp-row">
                <div class="stamp-box">
                    <img id="stamp-science" src="" alt="Science">
                    <p>Science</p>
                </div>
                <div class="stamp-box">
                    <img id="stamp-template" src="" alt="Template">
                    <p>Template</p>
                </div>
                <div class="stamp-box">
                    <img id="stamp-difference" src="" alt="Difference">
                    <p>Difference</p>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>光变曲线 (Light Curve)</h2>
            <canvas id="lightCurveChart"></canvas>
        </div>
    </div>

    <div class="card">
        <h2>测光历史数据</h2>
        <div style="overflow-x: auto;">
            <table id="history-table">
                <thead>
                    <tr>
                        <th>JD (儒略日)</th>
                        <th>观测日期</th>
                        <th>星等 (Mag)</th>
                        <th>误差 (dMag)</th>
                        <th>滤光片 (Filter)</th>
                    </tr>
                </thead>
                <tbody id="history-tbody">
                    <!-- 动态填充 -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let currentStamps = {};
    let chartInstance = null;

    const urlParams = new URLSearchParams(window.location.search);
    const targetId = urlParams.get('id');

    if (!targetId) {
        document.getElementById('target-title').innerText = '未指定目标 ID';
    } else {
        loadTargetData(targetId);
    }

    async function loadTargetData(id) {
        try {
            const response = await fetch(`targets/${id}.json`);
            if (!response.ok) throw new Error('无法加载目标数据文件');
            const data = await response.json();

            document.getElementById('target-title').innerText = `目标: ${data.object_id || id}`;
            document.getElementById('metadata-content').innerHTML = `
                <p><strong>赤经 (RA):</strong> ${data.ra || 'N/A'}</p>
                <p><strong>赤纬 (Dec):</strong> ${data.dec || 'N/A'}</p>
                <p><strong>分类/类型:</strong> ${data.class_name || 'Unclassified'}</p>
            `;

            if (data.stamps_by_epoch) {
                currentStamps = data.stamps_by_epoch;
                const select = document.getElementById('epoch-select');
                const epochs = Object.keys(currentStamps).sort();
                
                if (epochs.length > 1) {
                    document.getElementById('epoch-control-container').style.display = 'block';
                }
                
                select.innerHTML = '';
                epochs.forEach(epoch => {
                    let opt = document.createElement('option');
                    opt.value = epoch;
                    opt.text = epoch;
                    select.appendChild(opt);
                });

                if (epochs.length > 0) {
                    switchEpoch(epochs[epochs.length - 1]);
                }
            } else if (data.stamps) {
                document.getElementById('stamp-science').src = data.stamps.science || '';
                document.getElementById('stamp-template').src = data.stamps.template || '';
                document.getElementById('stamp-difference').src = data.stamps.difference || '';
            }

            if (data.history && data.history.length > 0) {
                renderLightCurve(data.history);
                renderHistoryTable(data.history);
            }

        } catch (err) {
            console.error(err);
            document.getElementById('target-title').innerText = '加载目标数据失败';
        }
    }

    function switchEpoch(epoch) {
        const stamps = currentStamps[epoch];
        if (stamps) {
            document.getElementById('stamp-science').src = stamps.science || '';
            document.getElementById('stamp-template').src = stamps.template || '';
            document.getElementById('stamp-difference').src = stamps.difference || '';
        }
    }

    function renderLightCurve(history) {
        const ctx = document.getElementById('lightCurveChart').getContext('2d');
        
        history.sort((a, b) => a.jd - b.jd);

        const labels = history.map(item => item.date || item.jd);
        const mags = history.map(item => item.mag);

        if (chartInstance) chartInstance.destroy();

        chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: '星等 (Magnitude)',
                    data: mags,
                    borderColor: '#38bdf8',
                    backgroundColor: 'rgba(56, 189, 248, 0.1)',
                    pointRadius: 4,
                    pointHoverRadius: 6,
                    tension: 0.1,
                    fill: false,
                    yAxisID: 'y'
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        reverse: true,
                        grid: { color: '#334155' },
                        ticks: { color: '#94a3b8' }
                    },
                    x: {
                        grid: { color: '#334155' },
                        ticks: { color: '#94a3b8' }
                    }
                },
                plugins: {
                    legend: { labels: { color: '#f8fafc' } }
                }
            }
        });
    }

    function renderHistoryTable(history) {
        const tbody = document.getElementById('history-tbody');
        tbody.innerHTML = '';
        history.forEach(item => {
            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${item.jd ? item.jd.toFixed(4) : 'N/A'}</td>
                <td>${item.date || 'N/A'}</td>
                <td>${item.mag !== undefined ? item.mag.toFixed(2) : 'N/A'}</td>
                <td>${item.dmag !== undefined ? item.dmag.toFixed(3) : 'N/A'}</td>
                <td>${item.filter || 'N/A'}</td>
            `;
            tbody.appendChild(tr);
        });
    }
</script>
</body>
</html>
