<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCAP - 目标详情</title>
    <!-- 引入 Chart.js 用于绘制光变曲线 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 1.5rem;
            margin: 0;
            color: #38bdf8;
        }
        .back-link {
            color: #94a3b8;
            text-decoration: none;
            transition: color 0.2s;
        }
        .back-link:hover {
            color: #f8fafc;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
        .card {
            background-color: #1e293b;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        .card h2 {
            font-size: 1.2rem;
            margin-top: 0;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
            color: #38bdf8;
        }
        .stamp-row {
            display: flex;
            justify-content: space-around;
            gap: 10px;
            text-align: center;
            margin-top: 15px;
        }
        .stamp-box {
            flex: 1;
        }
        .stamp-box img {
            max-width: 100%;
            height: auto;
            border: 1px solid #475569;
            border-radius: 4px;
            background: #000;
            aspect-ratio: 1 / 1;
            object-fit: cover;
        }
        .stamp-box p {
            font-size: 0.85rem;
            color: #94a3b8;
            margin: 5px 0 0 0;
        }
        .controls {
            margin-bottom: 15px;
            background: #0f172a;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
        }
        .controls label {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-right: 10px;
        }
        select {
            background: #334155;
            color: #fff;
            border: 1px solid #475569;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.95rem;
            cursor: pointer;
            outline: none;
        }
        select:focus {
            border-color: #38bdf8;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.9rem;
        }
        th, td {
            border: 1px solid #334155;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #0f172a;
            color: #38bdf8;
        }
        .hint {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 5px;
            display: block;
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1 id="target-title">DCAP 目标详情 - 加载中...</h1>
        <a href="index.html" class="back-link">&larr; 返回目标列表</a>
    </header>

    <div id="target-info" class="card">
        <h2>基本信息 (Metadata)</h2>
        <div id="metadata-content"></div>
    </div>

    <div class="grid">
        <div class="card">
            <h2>观测切片 (Stamps)</h2>
            <div class="controls" id="epoch-control-container" style="display:none;">
                <label for="epoch-select">选择观测时期：</label>
                <select id="epoch-select" onchange="switchEpoch(this.value)"></select>
                <span class="hint">💡 提示：点击右侧光变曲线上的数据点，即可快速切换到该日期的图像。</span>
            </div>
            
            <div class="stamp-row">
                <div class="stamp-box">
                    <img id="stamp-science" src="" alt="Science image not found" onerror="this.src='data:image/svg+xml;charset=utf-8,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' width=\'100\' height=\'100\'%3E%3Crect width=\'100\' height=\'100\' fill=\'%231e293b\'/%3E%3Ctext x=\'50%25\' y=\'50%25\' dominant-baseline=\'middle\' text-anchor=\'middle\' fill=\'%2364748b\' font-size=\'12\'%3E无数据%3C/text%3E%3C/svg%3E'">
                    <p>Science</p>
                </div>
                <div class="stamp-box">
                    <img id="stamp-template" src="" alt="Template image not found" onerror="this.src='data:image/svg+xml;charset=utf-8,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' width=\'100\' height=\'100\'%3E%3Crect width=\'100\' height=\'100\' fill=\'%231e293b\'/%3E%3Ctext x=\'50%25\' y=\'50%25\' dominant-baseline=\'middle\' text-anchor=\'middle\' fill=\'%2364748b\' font-size=\'12\'%3E无数据%3C/text%3E%3C/svg%3E'">
                    <p>Template</p>
                </div>
                <div class="stamp-box">
                    <img id="stamp-difference" src="" alt="Difference image not found" onerror="this.src='data:image/svg+xml;charset=utf-8,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' width=\'100\' height=\'100\'%3E%3Crect width=\'100\' height=\'100\' fill=\'%231e293b\'/%3E%3Ctext x=\'50%25\' y=\'50%25\' dominant-baseline=\'middle\' text-anchor=\'middle\' fill=\'%2364748b\' font-size=\'12\'%3E无数据%3C/text%3E%3C/svg%3E'">
                    <p>Difference</p>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>光变曲线 (Light Curve)</h2>
            <canvas id="lightCurveChart"></canvas>
        </div>
    </div>

    <div class="card">
        <h2>测光历史数据</h2>
        <div style="overflow-x: auto;">
            <table id="history-table">
                <thead>
                    <tr>
                        <th>JD (儒略日)</th>
                        <th>观测日期 (Date)</th>
                        <th>星等 (Mag)</th>
                        <th>误差 (dMag)</th>
                        <th>滤光片 (Filter)</th>
                    </tr>
                </thead>
                <tbody id="history-tbody">
                    <!-- 动态填充 -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let currentStamps = {};
    let chartInstance = null;

    // 获取 URL 中的目标 ID
    const urlParams = new URLSearchParams(window.location.search);
    const targetId = urlParams.get('id');

    if (!targetId) {
        document.getElementById('target-title').innerText = '未指定目标 ID';
    } else {
        loadTargetData(targetId);
    }

    async function loadTargetData(id) {
        try {
            const response = await fetch(`targets/${id}.json`);
            if (!response.ok) throw new Error('无法加载目标数据文件');
            const data = await response.json();

            // 渲染基本信息
            document.getElementById('target-title').innerText = `目标: ${id}`;
            document.getElementById('metadata-content').innerHTML = `
                <p><strong>赤经 (RA):</strong> ${data.RA || 'N/A'}</p>
                <p><strong>赤纬 (Dec):</strong> ${data.Dec || 'N/A'}</p>
            `;

            // 处理多时相切片 (stamps_by_epoch)
            if (data.stamps_by_epoch && Object.keys(data.stamps_by_epoch).length > 0) {
                currentStamps = data.stamps_by_epoch;
                const select = document.getElementById('epoch-select');
                const epochs = Object.keys(currentStamps).sort(); // 按日期排序
                
                document.getElementById('epoch-control-container').style.display = 'block';
                select.innerHTML = '';
                
                epochs.forEach(epoch => {
                    let opt = document.createElement('option');
                    opt.value = epoch;
                    opt.text = epoch;
                    select.appendChild(opt);
                });

                // 默认展示最新日期的切片
                const latestEpoch = epochs[epochs.length - 1];
                select.value = latestEpoch;
                switchEpoch(latestEpoch);
            }

            // 渲染历史数据和光变曲线
            if (data.history && data.history.length > 0) {
                renderLightCurve(data.history);
                renderHistoryTable(data.history);
            }

        } catch (err) {
            console.error(err);
            document.getElementById('target-title').innerText = '加载目标数据失败';
        }
    }

    // 切换切片图像
    function switchEpoch(epoch) {
        const stamps = currentStamps[epoch];
        if (stamps) {
            // 给图片地址加个随机参数防浏览器缓存失效，但这里是本地静态文件一般不需要
            document.getElementById('stamp-science').src = stamps.science || '';
            document.getElementById('stamp-template').src = stamps.template || '';
            document.getElementById('stamp-difference').src = stamps.difference || '';
        }
    }

    // 渲染光变曲线
    function renderLightCurve(history) {
        const ctx = document.getElementById('lightCurveChart').getContext('2d');
        
        // 过滤掉未探测到的极限星等上限 (is_limit) 数据，只画有明确星等的数据
        const validHistory = history.filter(item => !item.is_limit).sort((a, b) => a.jd - b.jd);

        const labels = validHistory.map(item => item.date || item.jd);
        const mags = validHistory.map(item => item.mag);

        if (chartInstance) chartInstance.destroy();

        chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: '观测星等 (Magnitude)',
                    data: mags,
                    borderColor: '#38bdf8',
                    backgroundColor: 'rgba(56, 189, 248, 0.5)',
                    pointRadius: 5,
                    pointHoverRadius: 8,
                    tension: 0, // 直线连接，更符合天文习惯
                    fill: false,
                    yAxisID: 'y'
                }]
            },
            options: {
                responsive: true,
                interaction: {
                    mode: 'nearest',
                    intersect: true
                },
                onClick: (event, activeElements) => {
                    // 🌟 联动功能：点击数据点，切换对应日期的切片
                    if (activeElements.length > 0) {
                        const dataIndex = activeElements[0].index;
                        const clickedDate = chartInstance.data.labels[dataIndex];
                        
                        if (currentStamps[clickedDate]) {
                            document.getElementById('epoch-select').value = clickedDate;
                            switchEpoch(clickedDate);
                        } else {
                            // 尝试模糊匹配，因为 JSON 中的 key 可能是 'MJD xxx' 或 'YYYY-MM-DD'
                            const availableEpochs = Object.keys(currentStamps);
                            const match = availableEpochs.find(e => e.includes(clickedDate) || clickedDate.includes(e));
                            if(match){
                                document.getElementById('epoch-select').value = match;
                                switchEpoch(match);
                            }
                        }
                    }
                },
                scales: {
                    y: {
                        reverse: true, // 星等越小越亮，Y轴翻转
                        grid: { color: '#334155' },
                        ticks: { color: '#94a3b8' },
                        title: { display: true, text: 'Mag', color: '#94a3b8' }
                    },
                    x: {
                        grid: { color: '#334155' },
                        ticks: { color: '#94a3b8' },
                        title: { display: true, text: 'Date', color: '#94a3b8' }
                    }
                },
                plugins: {
                    legend: { labels: { color: '#f8fafc' } },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return `Mag: ${context.parsed.y}`;
                            }
                        }
                    }
                }
            }
        });
    }

    // 渲染表格
    function renderHistoryTable(history) {
        const tbody = document.getElementById('history-tbody');
        tbody.innerHTML = '';
        // 倒序排列，让最新的数据在最上面
        const reversedHistory = [...history].sort((a, b) => b.jd - a.jd);

        reversedHistory.forEach(item => {
            let tr = document.createElement('tr');
            
            // 如果是极限星等，用不同颜色或符号标识
            let magText = item.is_limit ? `> ${item.mag.toFixed(2)} (Upper Limit)` : item.mag.toFixed(2);
            let dmagText = item.magerr ? item.magerr.toFixed(3) : '-';

            tr.innerHTML = `
                <td>${item.jd ? item.jd.toFixed(4) : 'N/A'}</td>
                <td>${item.date || 'N/A'}</td>
                <td style="${item.is_limit ? 'color:#64748b;' : 'color:#38bdf8; font-weight:bold;'}">${magText}</td>
                <td>${dmagText}</td>
                <td>${item.filter || 'N/A'}</td>
            `;
            tbody.appendChild(tr);
        });
    }
</script>
</body>
</html>
